<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cricket player stats sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="position:absolute;inset:0;padding:116px 20px 0;opacity:.35;display:flex;flex-direction:column;gap:14px">
    <div style="height:110px;border-radius:24px;background:#151518"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.62)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:10px 24px 34px;border-radius:30px 30px 0 0;background:#151518;display:flex;flex-direction:column;gap:20px">
    <span style="align-self:center;width:36px;height:5px;border-radius:3px;background:#3A3A42"></span>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:30px;font-stretch:62%;font-weight:800;line-height:1">Priya Nair</span>
      <span style="font-size:13px;color:#92929A">Royal Strikers · 5 matches</span>
    </div>

    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div style="display:flex;flex-direction:column;gap:10px">
        <span style="font-size:14px;font-weight:600">{{g.title}}</span>
        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 8px">
          <sc-for list="{{g.cells}}" as="c" hint-placeholder-count="4">
            <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:22px;font-stretch:62%;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:{{c.color}}">{{c.v}}</span><span style="font-size:11px;color:#92929A">{{c.k}}</span></span>
          </sc-for>
        </div>
      </div>
    </sc-for>

    <a href="CricketLeaderboard.dc.html" style="all:unset;cursor:pointer;height:52px;border-radius:16px;background:#1D1D21;display:grid;place-items:center;font-size:15px;font-weight:700">Done</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const cell = (k, v) => ({ k, v, color: v === '—' ? '#6E6E76' : '#F5F5F5' });
    const groups = [
      { title: 'Batting', cells: [cell('Runs', '118'), cell('Balls', '97'), cell('Average', '29.5'), cell('Strike rate', '121.6'), cell('Highest', '41'), cell('Fours', '12'), cell('Sixes', '3')] },
      { title: 'Bowling', cells: [cell('Overs', '14.2'), cell('Wickets', '6'), cell('Runs', '102'), cell('Economy', '7.1'), cell('Best', '3/18'), cell('Maidens', '1')] },
      { title: 'Fielding', cells: [cell('Catches', '4'), cell('Run outs', '1'), cell('Stumpings', '—')] },
    ];
    return { groups };
  }
}
</script>
</body>
</html>
