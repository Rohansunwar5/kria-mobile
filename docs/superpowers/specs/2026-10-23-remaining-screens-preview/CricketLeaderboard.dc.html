<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cricket player stats</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px">
    <button aria-label="Back" style="all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer"><span class="ms" style="font-size:24px">arrow_back</span></button>
    <span style="flex:1;padding-left:6px;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:600">Player stats</span><span style="font-size:11px;color:#92929A">Whitefield Premier Cup · Open</span></span>
    <span style="width:44px"></span>
  </div>

  <div style="display:flex;gap:8px;padding:12px 20px 0;overflow:hidden;white-space:nowrap">
    <sc-for list="{{sorts}}" as="c" hint-placeholder-count="7"><button aria-pressed="{{c.on}}" style="all:unset;cursor:pointer;flex:none;padding:8px 14px;border-radius:999px;background:{{c.bg}};color:{{c.fg}};font-size:13px;font-weight:600">{{c.label}}</button></sc-for>
  </div>

  <a href="CricketStats.dc.html" style="all:unset;cursor:pointer;box-sizing:border-box;margin:22px 20px 0;padding:18px 20px;border-radius:24px;background:#151518;display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
    <span style="display:flex;flex-direction:column;gap:6px;min-width:0">
      <span style="font-size:12px;font-weight:600;color:#FF7A45">Most runs</span>
      <span style="font-size:28px;font-stretch:62%;font-weight:800;line-height:.95">Rahul Menon</span>
      <span style="font-size:12px;color:#92929A">Thunder XI · HS 78</span>
    </span>
    <span style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
      <span style="font-size:56px;font-stretch:62%;font-weight:800;line-height:.9;font-variant-numeric:tabular-nums">214</span>
      <span style="font-size:12px;color:#92929A">runs</span>
    </span>
  </a>

  <div style="padding:28px 20px 0">
    <div style="display:grid;grid-template-columns:28px minmax(0,1fr) 36px 44px 48px;gap:8px;padding:0 10px 8px;font-size:11px;color:#6E6E76;text-align:right"><span style="text-align:left">#</span><span style="text-align:left">Player</span><span>Inn</span><span>Runs</span><span>SR</span></div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <a href="CricketStats.dc.html" style="all:unset;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1fr) 36px 44px 48px;gap:8px;align-items:center;min-height:52px;padding:0 10px;border-radius:14px;background:{{r.bg}};font-size:14px;font-variant-numeric:tabular-nums;text-align:right">
        <span style="text-align:left;font-size:18px;font-stretch:62%;font-weight:800;color:{{r.rankColor}}">{{r.rank}}</span>
        <span style="text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-weight:600;color:{{r.nameColor}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.name}}</span><span style="font-size:11px;color:#92929A">{{r.team}}</span></span>
        <span style="color:#92929A">{{r.inn}}</span>
        <span style="font-weight:700;color:{{r.nameColor}}">{{r.runs}}</span>
        <span style="color:#92929A">{{r.sr}}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sorts = ['Runs', 'Wickets', 'Strike rate', 'Economy', 'Fours', 'Sixes', 'Highest'].map((label, i) => ({ label, on: i === 0, bg: i === 0 ? '#F5F5F5' : '#151518', fg: i === 0 ? '#0B0B0D' : '#C6C6CC' }));
    const medal = ['#C9A35A', '#A9AFB7', '#A8714A'];
    const data = [
      ['Rahul Menon', 'Thunder XI', 5, 214, '148.6'],
      ['Imran Khan', 'Royal Strikers', 5, 187, '131.7'],
      ['Dev Patil', 'Thunder XI', 4, 151, '162.4'],
      ['Priya Nair', 'Royal Strikers', 5, 118, '121.6', true],
      ['Kunal Desai', 'Night Owls', 4, 96, '109.1'],
      ['Arjun Rao', 'Night Owls', 3, 71, '139.2'],
    ];
    const rows = data.map(([name, team, inn, runs, sr, me], i) => ({
      rank: i + 1, name, team, inn, runs, sr,
      rankColor: medal[i] || '#92929A',
      bg: me ? 'rgba(255,90,31,0.16)' : 'transparent',
      nameColor: me ? '#FF7A45' : '#F5F5F5',
    }));
    return { sorts, rows };
  }
}
</script>
</body>
</html>
