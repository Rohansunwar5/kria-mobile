<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px">

    <span style="font-size:15px;font-weight:600">Change password</span>
    <span style="width:44px"></span>
  </div>

  <div style="padding:12px 20px 0;display:flex;flex-direction:column;gap:22px">
    <p style="margin:0;font-size:13px;line-height:1.5;color:#92929A">You stay signed in on this phone. Other devices are signed out and need the new password.</p>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="cur" style="font-size:13px;font-weight:600;color:#C6C6CC">Current password</label>
      <div style="position:relative">
        <input id="cur" type="password" value="oldsecret1" style="box-sizing:border-box;width:100%;height:52px;padding:0 52px 0 16px;border-radius:14px;background:#151518;border:1px solid #2A2A30;color:#F5F5F5;font:400 15px 'Archivo',system-ui,sans-serif;outline:none">
        <button aria-label="Show password" style="all:unset;cursor:pointer;position:absolute;right:4px;top:4px;width:44px;height:44px;display:grid;place-items:center"><span class="ms" style="font-size:20px;color:#92929A">visibility</span></button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="new" style="font-size:13px;font-weight:600;color:#C6C6CC">New password</label>
      <div style="position:relative">
        <input id="new" type="password" value="smash2026" style="box-sizing:border-box;width:100%;height:52px;padding:0 52px 0 16px;border-radius:14px;background:#151518;border:1px solid #FF5A1F;color:#F5F5F5;font:400 15px 'Archivo',system-ui,sans-serif;outline:none">
        <button aria-label="Show password" style="all:unset;cursor:pointer;position:absolute;right:4px;top:4px;width:44px;height:44px;display:grid;place-items:center"><span class="ms" style="font-size:20px;color:#92929A">visibility</span></button>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <div style="flex:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px">
          <span style="height:4px;border-radius:2px;background:#FF5A1F"></span>
          <span style="height:4px;border-radius:2px;background:#FF5A1F"></span>
          <span style="height:4px;border-radius:2px;background:#26262B"></span>
          <span style="height:4px;border-radius:2px;background:#26262B"></span>
        </div>
        <span style="font-size:12px;color:#C6C6CC;width:44px;text-align:right">Fair</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px">
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#C6C6CC"><span class="ms" style="font-size:18px;color:#FF5A1F;font-variation-settings:'FILL' 1">check_circle</span>At least 8 characters</span>
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#C6C6CC"><span class="ms" style="font-size:18px;color:#FF5A1F;font-variation-settings:'FILL' 1">check_circle</span>One number</span>
        <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#92929A"><span class="ms" style="font-size:18px;color:#6E6E76">radio_button_unchecked</span>One symbol</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="conf" style="font-size:13px;font-weight:600;color:#C6C6CC">Confirm new password</label>
      <input id="conf" type="password" value="smash202" style="box-sizing:border-box;width:100%;height:52px;padding:0 16px;border-radius:14px;background:#151518;border:1px solid #2A2A30;color:#F5F5F5;font:400 15px 'Archivo',system-ui,sans-serif;outline:none">
      <span style="display:flex;align-items:center;gap:6px;font-size:12px;color:#FF7A4D"><span class="ms" style="font-size:16px">error</span>Doesn't match the new password</span>
    </div>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:#0B0B0D">
    <button disabled style="all:unset;box-sizing:border-box;width:100%;height:56px;border-radius:16px;background:#151518;color:#5E5E66;display:grid;place-items:center;font-size:15px;font-weight:700">Update password</button>
  </div>
</div>
