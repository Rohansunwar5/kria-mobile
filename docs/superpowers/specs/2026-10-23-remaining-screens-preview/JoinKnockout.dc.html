<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join a knockout</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px">
    <button aria-label="Back" style="all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer"><span class="ms" style="font-size:24px">arrow_back</span></button>
    <span style="font-size:15px;font-weight:600">Join</span>
    <span style="width:44px"></span>
  </div>

  <div style="padding:8px 20px 0;display:flex;flex-direction:column;gap:8px">
    <span style="font-size:12px;font-weight:600;color:#92929A">Knockout · Cricket</span>
    <span style="font-size:34px;font-stretch:62%;font-weight:800;line-height:.95">Sunday Gully Cup</span>
    <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#92929A">6 overs · 5 a side · hosted by Arjun Rao</span>
    <span style="font-size:13px;color:#92929A">11 players in so far</span>
  </div>

  <div style="padding:30px 20px 0;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:17px;font-weight:650">Pick your team</span>
    <span style="font-size:12px;color:#92929A">Or leave it to the draw.</span>
  </div>
  <div style="padding:14px 20px 0;display:flex;flex-direction:column;gap:8px">
    <sc-for list="{{teams}}" as="t" hint-placeholder-count="4">
      <button disabled="{{t.full}}" aria-pressed="{{t.on}}" style="all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border-radius:16px;background:{{t.bg}};box-shadow:{{t.ring}}">
        <span style="font-size:15px;font-weight:600;color:{{t.color}}">{{t.name}}</span>
        <span style="font-size:12px;color:#92929A;font-variant-numeric:tabular-nums">{{t.count}}</span>
      </button>
    </sc-for>
  </div>

  <div style="padding:28px 20px 0;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:15px;font-weight:650">Already added by the host?</span>
    <span style="font-size:12px;color:#92929A">Tap your name to take that place.</span>
  </div>
  <div style="padding:10px 20px 0;display:flex;flex-wrap:wrap;gap:8px">
    <button style="all:unset;cursor:pointer;height:40px;padding:0 14px;border-radius:999px;background:#151518;font-size:13px;font-weight:600;color:#C6C6CC">Sameer</button>
    <button style="all:unset;cursor:pointer;height:40px;padding:0 14px;border-radius:999px;background:#151518;font-size:13px;font-weight:600;color:#C6C6CC">Neel</button>
  </div>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:#0B0B0D">
    <button style="all:unset;cursor:pointer;box-sizing:border-box;width:100%;height:56px;border-radius:16px;background:#FF5A1F;color:#0B0B0D;display:grid;place-items:center;font-size:15px;font-weight:700">Join as Priya Nair</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const t = (name, n, of, on) => ({
      name, count: n >= of ? 'Full' : `${n}/${of}`, full: n >= of, on,
      bg: n >= of ? 'transparent' : '#151518',
      ring: on ? 'inset 0 0 0 1.5px #FF5A1F' : n >= of ? 'inset 0 0 0 1px #1D1D21' : 'none',
      color: n >= of ? '#6E6E76' : '#F5F5F5',
    });
    const teams = [t('Team A', 5, 5, false), t('Team B', 3, 5, true), t('Team C', 3, 5, false), { ...t('Any team', 0, 1, false), count: 'The draw places you', full: false, bg: '#151518', color: '#F5F5F5', ring: 'none' }];
    return { teams };
  }
}
</script>
</body>
</html>
