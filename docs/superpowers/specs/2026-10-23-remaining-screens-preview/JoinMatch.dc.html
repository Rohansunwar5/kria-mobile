<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join a match</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px">
    <button aria-label="Back" style="all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer"><span class="ms" style="font-size:24px">arrow_back</span></button>
    <span style="font-size:15px;font-weight:600">Join</span>
    <span style="width:44px"></span>
  </div>

  <div style="padding:8px 20px 0;display:flex;flex-direction:column;gap:8px">
    <span style="font-size:12px;font-weight:600;color:#92929A">Quick match · Badminton</span>
    <span style="font-size:34px;font-stretch:62%;font-weight:800;line-height:.95">Smash Bros vs Net Gains</span>
    <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#92929A">Doubles · best of 3 to 21<span style="font:600 12px 'JetBrains Mono',monospace;letter-spacing:.12em;padding:3px 7px;border-radius:7px;background:#151518;color:#C6C6CC">K7Q2MP</span></span>
  </div>

  <div style="padding:36px 20px 0;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:17px;font-weight:650">Pick your spot</span>
    <span style="font-size:12px;color:#92929A">Take the spot the host made for you, or any open one.</span>
  </div>

  <sc-for list="{{sides}}" as="side" hint-placeholder-count="2">
    <div style="padding:20px 20px 0;display:flex;flex-direction:column;gap:8px">
      <span style="font-size:13px;font-weight:600;color:#C6C6CC">{{side.name}}</span>
      <sc-for list="{{side.slots}}" as="sl" hint-placeholder-count="2">
        <button disabled="{{sl.taken}}" aria-pressed="{{sl.on}}" style="all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-radius:16px;background:{{sl.bg}};box-shadow:{{sl.ring}}">
          <span style="width:32px;height:32px;border-radius:50%;background:{{sl.avBg}};display:grid;place-items:center;font-size:11px;font-weight:700;color:{{sl.avFg}}">{{sl.ini}}<span class="ms" style="font-size:18px">{{sl.icon}}</span></span>
          <span style="flex:1;font-size:15px;font-weight:600;color:{{sl.nameColor}}">{{sl.name}}</span>
          <span style="font-size:12px;font-weight:600;color:{{sl.stateColor}}">{{sl.state}}</span>
        </button>
      </sc-for>
    </div>
  </sc-for>

  <div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:#0B0B0D">
    <button style="all:unset;cursor:pointer;box-sizing:border-box;width:100%;height:56px;border-radius:16px;background:#FF5A1F;color:#0B0B0D;display:grid;place-items:center;font-size:15px;font-weight:700">Take this spot</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const taken = (name, ini) => ({ name, ini, icon: '', taken: true, on: false, bg: 'transparent', ring: 'inset 0 0 0 1px #1D1D21', avBg: '#1D1D21', avFg: '#C6C6CC', nameColor: '#92929A', state: 'Taken', stateColor: '#6E6E76' });
    const open = (name, on) => ({ name, ini: '', icon: on ? 'check' : 'add', taken: false, on, bg: '#151518', ring: on ? 'inset 0 0 0 1.5px #FF5A1F' : 'none', avBg: on ? '#FF5A1F' : '#2A2A30', avFg: on ? '#0B0B0D' : '#C6C6CC', nameColor: '#F5F5F5', state: 'Open', stateColor: '#FF7A45' });
    const sides = [
      { name: 'Smash Bros', slots: [taken('Arjun Rao', 'AR'), taken('Kabir Shah', 'KS')] },
      { name: 'Net Gains', slots: [taken('Meera Iyer', 'MI'), open('Player 4', true)] },
    ];
    return { sides };
  }
}
</script>
</body>
</html>
