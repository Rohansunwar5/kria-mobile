<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
textarea::placeholder{color:#6E6E76}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px">
    <button aria-label="Back" style="all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer"><span class="ms" style="font-size:24px">arrow_back</span></button>
    <span style="font-size:15px;font-weight:600">Settings</span>
    <span style="width:44px"></span>
  </div>

  <div style="padding:20px 20px 0;display:flex;flex-direction:column">
    <span style="font-size:17px;font-weight:650">Account</span>
    <div style="margin-top:12px;display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid #18181B">
        <span class="ms" style="font-size:22px;color:#92929A">mail</span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#92929A">Signed in as</span><span style="font-size:14px;font-weight:600">priya.n@gmail.com</span></span>
      </div>
      <a href="ChangePassword.dc.html" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:60px;border-bottom:1px solid #18181B">
        <span class="ms" style="font-size:22px;color:#92929A">lock</span>
        <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">Change password</span><span style="font-size:12px;color:#92929A">Other devices are signed out</span></span>
        <span class="ms" style="font-size:20px;color:#5E5E66">chevron_right</span>
      </a>
    </div>
  </div>

  <div style="padding:44px 20px 0;display:flex;flex-direction:column;gap:4px">
    <span style="font-size:17px;font-weight:650">Get help</span>
    <span style="font-size:12px;color:#92929A">Tell us what went wrong. We reply to priya.n@gmail.com.</span>
  </div>
  <div style="padding:18px 20px 0;display:flex;flex-direction:column;gap:8px">
    <label for="msg" style="font-size:13px;font-weight:600;color:#C6C6CC">Message</label>
    <textarea id="msg" placeholder="What happened, and where in the app?" style="box-sizing:border-box;width:100%;height:132px;resize:none;padding:14px 16px;border-radius:14px;background:#151518;border:1px solid #2A2A30;color:#F5F5F5;font:400 15px/1.45 'Archivo',system-ui,sans-serif;outline:none"></textarea>
    <span style="font-size:12px;color:#6E6E76">At least 10 characters</span>
    <button style="all:unset;cursor:pointer;margin-top:8px;height:56px;border-radius:16px;background:#1D1D21;display:grid;place-items:center;font-size:15px;font-weight:700">Send message</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
