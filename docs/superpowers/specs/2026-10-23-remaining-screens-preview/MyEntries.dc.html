<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My entries</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px">
    <button aria-label="Back" style="all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer"><span class="ms" style="font-size:24px">arrow_back</span></button>
    <span style="font-size:15px;font-weight:600">My entries</span>
    <span style="width:44px"></span>
  </div>

  <div style="padding:16px 20px 0;display:flex;justify-content:space-between;align-items:baseline">
    <span style="font-size:17px;font-weight:650">Active</span>
    <span style="font-size:12px;color:#92929A;font-variant-numeric:tabular-nums">3 entries</span>
  </div>
  <div style="padding:6px 20px 0;display:flex;flex-direction:column">
    <sc-for list="{{active}}" as="e" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #18181B">
        <a href="#" aria-label="{{e.name}}" style="all:unset;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;gap:12px">
          <span style="width:36px;height:36px;border-radius:50%;background:#1D1D21;display:grid;place-items:center;flex:none"><span class="ms" style="font-size:20px;color:#92929A">{{e.icon}}</span></span>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{e.name}}</span>
            <span style="font-size:12px;color:#92929A">{{e.sub}}</span>
            <span style="font-size:12px;font-weight:600;color:{{e.color}}">{{e.status}}</span>
          </span>
        </a>
        <sc-if value="{{e.canWithdraw}}" hint-placeholder-val="{{false}}"><button style="all:unset;cursor:pointer;height:36px;padding:0 14px;border-radius:12px;background:#1D1D21;font-size:13px;font-weight:600;color:#C6C6CC">Withdraw</button></sc-if>
      </div>
    </sc-for>
  </div>

  <div style="padding:44px 20px 0;display:flex;justify-content:space-between;align-items:baseline">
    <span style="font-size:17px;font-weight:650">Closed</span>
    <span style="font-size:12px;color:#92929A">2 entries</span>
  </div>
  <div style="padding:6px 20px 0;display:flex;flex-direction:column">
    <sc-for list="{{closed}}" as="e" hint-placeholder-count="2">
      <a href="#" aria-label="{{e.name}}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #18181B">
        <span style="width:36px;height:36px;border-radius:50%;background:#151518;display:grid;place-items:center;flex:none"><span class="ms" style="font-size:20px;color:#6E6E76">{{e.icon}}</span></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:14px;font-weight:600;color:#C6C6CC">{{e.name}}</span>
          <span style="font-size:12px;color:#92929A">{{e.sub}}</span>
          <span style="font-size:12px;font-weight:600;color:{{e.color}}">{{e.status}}</span>
        </span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const active = [
      { name: 'Koramangala Smash Open', sub: "Women's Singles · Badminton", status: 'Awaiting approval', color: '#C6C6CC', icon: 'sports_tennis', canWithdraw: true },
      { name: 'HSR Weekend League', sub: 'Open · Cricket', status: 'Approved', color: '#F5F5F5', icon: 'sports_cricket', canWithdraw: true },
      { name: 'Whitefield Premier Cup', sub: 'Open · Cricket', status: 'Drafted · sold ₹12,000', color: '#FF7A45', icon: 'sports_cricket', canWithdraw: false },
    ];
    const closed = [
      { name: 'Indiranagar Doubles Night', sub: "Mixed Doubles · Badminton", status: 'Withdrawn', color: '#6E6E76', icon: 'sports_tennis' },
      { name: 'Jayanagar Masters', sub: "Women's 35+ · Badminton", status: 'Not accepted by the organiser', color: '#F26B76', icon: 'sports_tennis' },
    ];
    return { active, closed };
  }
}
</script>
</body>
</html>
