<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;family=JetBrains+Mono:wght@600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="height:56px;margin-top:44px;display:flex;align-items:center;justify-content:space-between;padding:0 12px">
    <button aria-label="Back" style="all:unset;width:44px;height:44px;display:grid;place-items:center;cursor:pointer"><span class="ms" style="font-size:24px">arrow_back</span></button>
    <span style="font-size:15px;font-weight:600">Payments</span>
    <span style="width:44px"></span>
  </div>

  <div style="padding:16px 20px 0;display:flex;flex-direction:column;gap:6px">
    <span style="font-size:12px;font-weight:600;color:#92929A">Total paid</span>
    <span style="font-size:56px;font-stretch:62%;font-weight:800;line-height:.92;font-variant-numeric:tabular-nums">₹2,094.40</span>
    <span style="font-size:13px;color:#92929A">3 entry fees</span>
  </div>

  <div style="padding:44px 20px 0">
    <span style="font-size:17px;font-weight:650">Paid entries</span>
  </div>
  <div style="padding:6px 20px 0;display:flex;flex-direction:column">
    <sc-for list="{{rows}}" as="p" hint-placeholder-count="3">
      <a href="PaymentSheet.dc.html" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #18181B">
        <span style="width:36px;height:36px;border-radius:50%;background:#1D1D21;display:grid;place-items:center;flex:none"><span class="ms" style="font-size:20px;color:#92929A">receipt_long</span></span>
        <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
          <span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{p.name}}</span>
          <span style="font-size:12px;color:#92929A">{{p.sub}}</span>
        </span>
        <span style="font-size:14px;font-weight:600;font-variant-numeric:tabular-nums">{{p.amount}}</span>
        <span class="ms" style="font-size:20px;color:#5E5E66">chevron_right</span>
      </a>
    </sc-for>
  </div>
  <p style="margin:0;padding:18px 20px 0;font-size:12px;line-height:1.5;color:#6E6E76">Razorpay emails a receipt for each payment to priya.n@gmail.com.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [
      { name: 'Koramangala Smash Open', sub: "Women's Singles · 14 Oct", amount: '₹1,047.20' },
      { name: 'HSR Weekend League', sub: 'Open · 2 Sep', amount: '₹523.60' },
      { name: 'Whitefield Premier Cup', sub: 'Open · 18 Jul', amount: '₹523.60' },
    ];
    return { rows };
  }
}
</script>
</body>
</html>
