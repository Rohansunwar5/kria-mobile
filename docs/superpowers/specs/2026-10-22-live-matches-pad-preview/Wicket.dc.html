<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wicket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="position:absolute;inset:0;padding:110px 20px 0;opacity:.35">
    <div style="border-radius:26px;background:#151518;height:170px"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.62)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:10px 20px 30px;border-radius:30px 30px 0 0;background:#151518;display:flex;flex-direction:column;gap:18px">
    <div style="align-self:center;width:36px;height:5px;border-radius:3px;background:#3A3A42"></div>
    <div style="display:flex;align-items:center;gap:6px">
      <button aria-label="Back" style="all:unset;cursor:pointer;width:36px;height:36px;margin-left:-8px;display:grid;place-items:center"><span class="ms" style="font-size:22px">arrow_back</span></button>
      <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:650">How was it out?</span><span style="font-size:12px;color:#92929A">Player F is on strike · Player K bowling</span></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
      <sc-for list="{{types}}" as="t" hint-placeholder-count="7"><button style="all:unset;cursor:pointer;height:52px;padding:0 14px;border-radius:14px;background:#1D1D21;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600"><span>{{t.label}}</span><span style="font-size:11px;font-weight:500;color:#92929A">{{t.next}}</span></button></sc-for>
    </div>
    <span style="font-size:12px;color:#6E6E76;line-height:1.45">Caught, run out and stumped ask who took it next. Run out and retired hurt ask which batter.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const types = [['Bowled', ''], ['Caught', 'then fielder'], ['LBW', ''], ['Run out', 'then batter'], ['Stumped', 'then keeper'], ['Hit wicket', ''], ['Retired hurt', 'then batter']]
      .map(([label, next]) => ({ label, next }));
    return { types };
  }
}
</script>
</body>
</html>
