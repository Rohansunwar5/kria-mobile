<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New over: pick the bowler</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="position:absolute;inset:0;padding:110px 20px 0;opacity:.35">
    <div style="border-radius:26px;background:#151518;height:170px"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.62)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:10px 20px 30px;border-radius:30px 30px 0 0;background:#151518;display:flex;flex-direction:column;gap:14px">
    <div style="align-self:center;width:36px;height:5px;border-radius:3px;background:#3A3A42"></div>
    <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:650">Over 8 · who's bowling?</span><span style="font-size:12px;color:#92929A">Office Strikers 64/3 · Player K bowled the last over</span></span>
    <div style="display:flex;flex-direction:column">
      <sc-for list="{{bowlers}}" as="b" hint-placeholder-count="6">
        <button style="all:unset;cursor:pointer;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:52px;border-top:1px solid #1D1D21;opacity:{{b.op}}">
          <span style="width:36px;height:36px;border-radius:50%;background:#1D1D21;display:grid;place-items:center;font-size:12px;font-weight:650">{{b.ini}}</span>
          <span style="font-size:15px;font-weight:600">{{b.name}}</span>
          <span style="font-size:12px;color:#92929A;font-variant-numeric:tabular-nums">{{b.figs}}</span>
        </button>
      </sc-for>
    </div>
    <span style="font-size:12px;color:#6E6E76;line-height:1.45">The same list picks the opening batters, the next batter after a wicket, and the fielder for a catch, run out or stumping.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const rows = [['Player H', '2-0-14-1', 1], ['Player J', '1-0-12-0', 1], ['Player K', '2-0-21-1', 1], ['Player L', 'yet to bowl', 1], ['Player M', 'yet to bowl', 1], ['Player N', 'yet to bowl', 1]];
    return { bowlers: rows.map(([name, figs, op]) => ({ name, figs, op, ini: 'P' + name.slice(-1) })) };
  }
}
</script>
</body>
</html>
