<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Extras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,200..500,0..1,0&amp;display=block" rel="stylesheet">
<style>
body{margin:0;background:#0B0B0D}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;font-feature-settings:'liga'}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#F5F5F5;font-family:'Archivo',system-ui,sans-serif">
  <div style="position:absolute;inset:0;padding:110px 20px 0;opacity:.35">
    <div style="border-radius:26px;background:#151518;height:170px"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(0,0,0,.62)"></div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:10px 20px 30px;border-radius:30px 30px 0 0;background:#151518;display:flex;flex-direction:column;gap:18px">
    <div style="align-self:center;width:36px;height:5px;border-radius:3px;background:#3A3A42"></div>
    <div style="display:flex;align-items:center;gap:6px">
      <button aria-label="Back" style="all:unset;cursor:pointer;width:36px;height:36px;margin-left:-8px;display:grid;place-items:center"><span class="ms" style="font-size:22px">arrow_back</span></button>
      <span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:17px;font-weight:650">Extras</span><span style="font-size:12px;color:#92929A">Pick the kind, then tap the runs to record the ball.</span></span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:3px;border-radius:14px;background:#0B0B0D">
      <sc-for list="{{kinds}}" as="k" hint-placeholder-count="4"><button style="all:unset;cursor:pointer;height:40px;border-radius:11px;display:grid;place-items:center;font-size:13px;font-weight:600;background:{{k.bg}};color:{{k.fg}}">{{k.label}}</button></sc-for>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <span style="font-size:13px;font-weight:600;color:#C6C6CC">Wide · runs</span>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <sc-for list="{{runs}}" as="r" hint-placeholder-count="6"><button style="all:unset;cursor:pointer;height:56px;border-radius:16px;background:#1D1D21;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px"><span style="font-size:26px;font-stretch:62%;font-weight:800;line-height:1">{{r.n}}</span></button></sc-for>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:#0B0B0D;cursor:pointer">
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">Wicket on this ball too</span><span style="font-size:12px;color:#92929A">A stumping off a wide, a run out going for a bye</span></span>
      <input type="checkbox" aria-label="Wicket on this ball too" style="width:22px;height:22px;accent-color:#FF5A1F">
    </label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const kinds = ['Wide', 'No ball', 'Bye', 'Leg bye'].map((label, i) => (i === 0 ? { label, bg: '#F5F5F5', fg: '#0B0B0D' } : { label, bg: 'transparent', fg: '#85858D' }));
    const runs = [1, 2, 3, 4, 5, 6].map((n) => ({ n }));
    return { kinds, runs };
  }
}
</script>
</body>
</html>
