<div class="scr">
  <!-- Home, dimmed behind the sheet -->
  <div class="safe"></div>
  <div style="display:flex;align-items:center;gap:11px;padding:6px 16px 12px;flex:none;opacity:0.34">
    <img src="logo.png" alt="" style="width:33px;height:29px;object-fit:contain;flex:none">
    <div class="ant" style="font-size:23px;line-height:21px">Kria</div>
    <div style="flex:1"></div>
    <div class="avat" style="width:38px;height:38px;font-size:14px">RS</div>
  </div>
  <div style="height:2px;flex:none;background:rgba(255,255,255,0.10);position:relative;opacity:0.34">
    <div style="position:absolute;left:16px;top:0;width:54px;height:2px;background:#F97316"></div>
  </div>
  <div style="flex:1"></div>
  <div style="position:absolute;inset:0;background:rgba(11,11,11,0.72)"></div>

  <!-- ==== FILTER SHEET ==== only what the list endpoint actually accepts:
       sport, city, status. Anything else would be a control that cannot work. -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#151515;border-top:1.5px solid rgba(255,255,255,0.14);border-radius:6px 6px 0 0;display:flex;flex-direction:column">
    <div style="display:flex;justify-content:center;padding:9px 0 0;flex:none">
      <div style="width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,0.20)"></div>
    </div>

    <div style="display:flex;align-items:center;padding:13px 16px 14px;flex:none">
      <div class="ant" style="font-size:26px;line-height:24px">Filter</div>
      <div style="flex:1"></div>
      <div class="mn" style="font-size:10px;font-weight:700;color:#7d7d7d;letter-spacing:0.14em">CLEAR ALL</div>
    </div>
    <div class="divide"></div>

    <!-- Sport -->
    <div style="padding:16px 16px 0;flex:none">
      <div class="lbl" style="letter-spacing:0.16em;margin-bottom:9px">Sport</div>
      <div style="display:flex;gap:9px">
        <div style="flex:1;height:62px;border-radius:5px;background:#F97316;color:#0B0B0B;display:flex;align-items:center;gap:9px;padding:0 13px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M9.5 3h5l1 4h-7z"/><path d="M7.5 7 4 19l8 2 8-2L16.5 7z"/><path d="M10 7 8.4 19M14 7l1.6 12M12 7v14"/></svg>
          <span class="ant" style="font-size:16px">Badminton</span>
          <div style="flex:1"></div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 12.5 9.5 18 20 6"/></svg>
        </div>
        <div style="flex:1;height:62px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.16);color:#bdbdbd;display:flex;align-items:center;gap:9px;padding:0 13px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M10 2.5h4v4h-4z"/><path d="M8.5 6.5h7l-.5 10-3 5-3-5z"/><path d="M12 8v12"/></svg>
          <span class="ant" style="font-size:16px;color:#fff">Cricket</span>
        </div>
      </div>
    </div>

    <!-- City -->
    <div style="padding:20px 16px 0;flex:none">
      <div class="lbl" style="letter-spacing:0.16em;margin-bottom:9px">City</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <div class="chip chip-on" style="padding:9px 13px">Bangalore</div>
        <div class="chip" style="padding:9px 13px">Mumbai</div>
        <div class="chip" style="padding:9px 13px">Delhi</div>
        <div class="chip" style="padding:9px 13px">Chennai</div>
        <div class="chip" style="padding:9px 13px">Pune</div>
        <div class="chip" style="padding:9px 13px">Hyderabad</div>
        <div class="chip" style="padding:9px 13px">Kolkata</div>
      </div>
    </div>

    <!-- Status -->
    <div style="padding:20px 16px 0;flex:none">
      <div class="lbl" style="letter-spacing:0.16em;margin-bottom:9px">Stage</div>
      <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:9px">
        <div style="height:46px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.16);display:flex;align-items:center;gap:9px;padding:0 12px">
          <div style="width:9px;height:9px;border-radius:2px;background:#16C46A;flex:none"></div>
          <span class="mn" style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#fff;text-transform:uppercase">Open</span>
        </div>
        <div style="height:46px;border-radius:5px;box-shadow:inset 0 0 0 1.5px #F97316;background:rgba(249,115,22,0.12);display:flex;align-items:center;gap:9px;padding:0 12px">
          <div style="width:9px;height:9px;border-radius:2px;background:#F97316;flex:none"></div>
          <span class="mn" style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#fff;text-transform:uppercase">Live</span>
          <div style="flex:1"></div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 12.5 9.5 18 20 6"/></svg>
        </div>
        <div style="height:46px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.16);display:flex;align-items:center;gap:9px;padding:0 12px">
          <div style="width:9px;height:9px;border-radius:2px;background:#FA4C93;flex:none"></div>
          <span class="mn" style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#fff;text-transform:uppercase">Auction</span>
        </div>
        <div style="height:46px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.16);display:flex;align-items:center;gap:9px;padding:0 12px">
          <div style="width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,0.28);flex:none"></div>
          <span class="mn" style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:#fff;text-transform:uppercase">Ended</span>
        </div>
      </div>
    </div>

    <!-- Footer: the count is the whole point of a filter sheet -->
    <div style="display:flex;gap:9px;padding:20px 16px 26px;flex:none;margin-top:6px;border-top:1.5px solid rgba(255,255,255,0.10)">
      <div style="width:104px;height:54px;border-radius:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,0.22);display:flex;align-items:center;justify-content:center">
        <span class="ant" style="font-size:15px;color:#fff">Reset</span>
      </div>
      <div style="flex:1;height:54px;border-radius:5px;background:#F97316;color:#0B0B0B;display:flex;align-items:center;justify-content:center;gap:9px">
        <span class="ant" style="font-size:17px">Show 12 events</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 12h16M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>
  <div class="grain"></div>
</div>
