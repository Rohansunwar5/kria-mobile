        </div>
      </div>
      <div style="flex:1">
        <div class="ant" style="font-size:17px;line-height:16px">Player photo</div>

      <div style="display:flex;gap:9px;margin-bottom:11px">
        <div style="flex:1">
          <div class="lbl" style="margin-bottom:6px">First name</div>
          <div style="height:52px;border-radius:5px;background:rgba(255,255,255,0.06);border:1.5px solid #F97316;display:flex;align-items:center;padding:0 13px">
            <span style="font-size:15px;color:#fff">Rohan</span>
            <span style="width:1.5px;height:20px;background:#F97316;margin-left:2px"></span>

        <div style="flex:1">

        </div>

        <span style="width:1.5px;height:22px;background:rgba(255,255,255,0.14)"></span>
        <span class="mn" style="font-size:15px;color:#fff">98450 12345</span>
      </div>
    </div>

    <!-- Playing details -->
    <div style="padding:6px 16px 0;position:relative">

      <div style="display:flex;gap:0;margin-bottom:11px;border:1.5px solid rgba(255,255,255,0.14);border-radius:5px;overflow:hidden">
        <div style="flex:1;padding:13px 0;text-align:center;background:#F97316"><span class="ant" style="font-size:13px;color:#0B0B0B">Male</span></div>
        <div style="flex:1;padding:13px 0;text-align:center;border-left:1.5px solid rgba(255,255,255,0.14)"><span class="ant" style="font-size:13px;color:#7d7d7d">Female</span></div>

      <div style="display:flex;gap:9px">

          </div>
        </div>
        <div style="flex:1">
          <div class="lbl" style="margin-bottom:6px">City</div>
          <div style="height:52px;border-radius:5px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.14);display:flex;align-items:center;padding:0 13px">
            <span style="font-size:15px;color:#fff">Bangalore</span>
