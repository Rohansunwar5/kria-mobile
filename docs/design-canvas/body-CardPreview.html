<div class="scr">
  <div class="safe"></div>
  <div class="hdr" style="border-bottom:0">
    <div class="iconbtn"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linecap="square" stroke-linejoin="miter"><path d="M14 6l-6 6 6 6"/></svg></div>
    <div style="flex:1"></div>
    <div class="mn" style="font-size:9px;color:#7d7d7d;letter-spacing:0.16em">STEP 3 OF 4</div>
  </div>

  <div style="flex:1;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center;padding:0 20px">
    <div class="ghost" style="font-size:230px;left:-34px;top:120px">ID</div>

    <div class="kick" style="letter-spacing:0.3em;padding-top:6px;position:relative">Your player card</div>

    <!-- The card -->
    <div style="width:250px;margin-top:20px;position:relative;background:#151515;border:1.5px solid rgba(255,255,255,0.16);border-radius:6px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,0.6)">
      <!-- Header band -->
      <div style="background:#F97316;padding:8px 12px;display:flex;align-items:center;justify-content:space-between">
        <span class="ant" style="font-size:15px;color:#0B0B0B">Kria</span>
        <span class="mn" style="font-size:8px;font-weight:700;color:rgba(11,11,11,0.72);letter-spacing:0.16em">PLAYER ID</span>
      </div>

      <!-- Portrait slot -->
      <div style="height:184px;position:relative;background:linear-gradient(160deg,#2a1a10,#161616);border-bottom:1.5px solid rgba(255,255,255,0.10)">
        <div class="hairlines" style="position:absolute;inset:0"></div>
        <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:9px">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#5c5c5c" stroke-width="1.9" stroke-linecap="square" stroke-linejoin="miter"><path d="M12 4a3.8 3.8 0 1 1 0 7.6A3.8 3.8 0 0 1 12 4Z"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>
          <span class="mn" style="font-size:8px;color:#5c5c5c;letter-spacing:0.14em">ADD A PHOTO</span>
        </div>
        <div class="tag t-mag" style="position:absolute;top:10px;right:10px">Preview</div>
      </div>

      <!-- Identity -->
      <div style="padding:12px">
        <div class="ant" style="font-size:26px;line-height:23px">Rohan<br>Sunwar</div>
        <div style="display:flex;gap:6px;margin-top:11px">
          <div class="tag t-live">Badminton</div>
          <div class="tag t-up">Bangalore</div>
        </div>
      </div>

      <div class="hazard" style="height:4px"></div>

      <!-- Footer data -->
      <div style="display:flex;padding:9px 12px;background:#0B0B0B">
        <div style="flex:1">
          <div class="lbl" style="font-size:8px;letter-spacing:0.14em">Player no.</div>
          <div class="mn" style="font-size:12px;font-weight:700;color:#fff;margin-top:3px">KRIA·0000</div>
        </div>
        <div style="text-align:right">
          <div class="lbl" style="font-size:8px;letter-spacing:0.14em">Issued</div>
          <div class="mn" style="font-size:12px;font-weight:700;color:#7d7d7d;margin-top:3px">PENDING</div>
        </div>
      </div>
    </div>

    <!-- Pitch -->
    <div style="text-align:center;padding-top:24px;position:relative">
      <div class="ant" style="font-size:28px;line-height:25px">Let's make<br>it yours.</div>
      <div class="body" style="font-size:13px;margin-top:10px;max-width:270px">Create your account to claim the card and get your player number.</div>
    </div>
  </div>

  <div style="flex:none;padding:12px 20px 26px">
    <div class="btnx">
      Claim my card
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#0B0B0B" stroke-width="2.8" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 12h14M12 6l6 6-6 6"/></svg>
    </div>
  </div>
  <div class="grain"></div>
</div>
